<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nike ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #4b1838, #1b0b20 75%);
  color: white;
  font-family: Tahoma, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.intro {
  position: relative;
  z-index: 5;
  text-align: center;
  padding: 25px;
  transition: opacity 1s, transform 1s;
}

.intro h1 {
  color: #ffd4e6;
  font-size: clamp(28px, 7vw, 42px);
  text-shadow: 0 0 20px #ff6ba8;
}

.intro p {
  color: #f9d8e8;
  font-size: 16px;
  line-height: 2;
}

button {
  border: none;
  border-radius: 40px;
  padding: 15px 32px;
  margin-top: 18px;
  background: linear-gradient(135deg, #ff6b9d, #e52e70);
  color: white;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 0 25px #ff4f91;
  transition: transform .3s;
}

button:active { transform: scale(.94); }

#garden {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

/* گل‌هایی که از مرکز به اطراف حرکت می‌کنند */
.flower {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--size);
  height: var(--size);
  transform: translate(-50%, -50%) translate(0, 0) scale(0);
  animation: bloom 2.8s cubic-bezier(.15,.75,.25,1) forwards;
  animation-delay: var(--delay);
  filter: drop-shadow(0 0 9px #ff8fbd);
}

@keyframes bloom {
  0% {
    transform: translate(-50%, -50%) translate(0, 0) scale(0) rotate(0deg);
    opacity: 0;
  }
  25% { opacity: 1; }
  100% {
    transform: translate(-50%, -50%)
      translate(var(--dx), var(--dy))
      scale(1) rotate(var(--rotation));
    opacity: 1;
  }
}

.petal {
  position: absolute;
  width: 34%;
  height: 48%;
  left: 33%;
  top: 2%;
  border-radius: 50% 50% 42% 42%;
  background: var(--color);
  transform-origin: 50% 100%;
  transform: rotate(var(--angle));
  box-shadow: inset -2px -3px 5px #0002;
}

.flower-center {
  position: absolute;
  width: 24%;
  height: 24%;
  left: 38%;
  top: 38%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff6a5, #ffb52d);
  box-shadow: 0 0 9px #ffe58a;
}

.heart {
  position: fixed;
  bottom: -30px;
  animation: floatUp linear forwards;
  opacity: 0;
  z-index: 2;
  pointer-events: none;
}

@keyframes floatUp {
  10% { opacity: .9; }
  100% {
    transform: translateY(-110vh) rotate(35deg);
    opacity: 0;
  }
}

#message {
  position: fixed;
  z-index: 4;
  left: 50%;
  top: 50%;
  width: min(88%, 470px);
  transform: translate(-50%, -50%) scale(.8);
  text-align: center;
  opacity: 0;
  visibility: hidden;
  padding: 28px 22px;
  border: 1px solid #ff9ac7;
  border-radius: 25px;
  background: #35132be8;
  box-shadow: 0 0 45px #ff4f91a0;
  transition: opacity 1.5s, transform 1.5s;
  backdrop-filter: blur(8px);
}

#message.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
}

#message h2 {
  color: #ffb5d2;
  font-size: 27px;
  margin-top: 0;
}

#message p {
  font-size: 17px;
  line-height: 2.4;
  color: #fff0f6;
}

#message .signature {
  color: #ff9dc6;
  font-size: 20px;
}

#replay {
  display: none;
  position: fixed;
  z-index: 6;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  .flower { animation-duration: 1s; }
}
</style>
</head>

<body>

<div class="intro" id="intro">
  <h1>برای تو، نیکی جان ❤️</h1>
  <p>یک سورپرایز کوچک برای خاص‌ترین آدم زندگی‌ام...</p>
  <button onclick="startSurprise()">اینجا رو لمس کن 🌷</button>
</div>

<div id="garden"></div>

<div id="message">
  <h2>نیکی جان، دختلم ❤️</h2>
  <p>
    اگر می‌توانستم تمام گل‌های دنیا را برایت بیاورم،
    باز هم هیچ‌کدام به زیبایی لبخند تو نبودند.
    <br>
    این گل‌ها فقط بهانه‌ای هستند تا به تو بگویم
    چقدر برایم خاصی.
    <br>
    دوستت دارم، دختلم. 🌹
  </p>
  <div class="signature">تا همیشه، با عشق ❤️</div>
</div>

  <button id="replay" onclick="location.reload()">
  دوباره ببین 🌸
</button>

<script>
let started = false;

function startSurprise() {
  if (started) return;
  started = true;

  const intro = document.getElementById("intro");
  const garden = document.getElementById("garden");
  const message = document.getElementById("message");

  intro.style.opacity = "0";
  intro.style.transform = "scale(.7)";

  setTimeout(() => intro.style.display = "none", 1000);

  const colors = [
    "#ff6fae", "#ff9bc8", "#f8b4d9",
    "#d9a7ff", "#ffcadc", "#ff477e",
    "#fff0f5"
  ];

  // گل‌ها از مرکز صفحه به چهار طرف پخش می‌شوند
  for (let i = 0; i < 65; i++) {
    const flower = document.createElement("div");
    flower.className = "flower";

    const size = 25 + Math.random() * 35;
    const angle = Math.random() * Math.PI * 2;
    const distance = 45 + Math.random() *
      Math.min(window.innerWidth, window.innerHeight) * .65;

    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance;

    flower.style.setProperty("--size", size + "px");
    flower.style.setProperty("--dx", dx + "px");
    flower.style.setProperty("--dy", dy + "px");
    flower.style.setProperty("--delay", (i * 0.045) + "s");
    flower.style.setProperty("--rotation", (Math.random() * 180) + "deg");
    flower.style.setProperty("--color",
      colors[Math.floor(Math.random() * colors.length)]);

    // ساخت گل با هشت گلبرگ
    for (let j = 0; j < 8; j++) {
      const petal = document.createElement("span");
      petal.className = "petal";
      petal.style.setProperty("--angle", (j * 45) + "deg");
      flower.appendChild(petal);
    }

    const center = document.createElement("span");
    center.className = "flower-center";
    flower.appendChild(center);

    garden.appendChild(flower);
  }

  // قلب‌های شناور
  for (let i = 0; i < 35; i++) {
    setTimeout(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["❤️", "💕", "💗", "💖", "✨"][
        Math.floor(Math.random() * 5)
      ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 22) + "px";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 11000);
    }, i * 180);
  }

  // نمایش پیام بعد از شکوفایی گل‌ها
  setTimeout(() => {
    message.classList.add("show");
    document.getElementById("replay").style.display = "block";
  }, 6200);
}
</script>

</body>
</html>
